<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=/tr/#programs">
    <link rel="canonical" href="https://starspeakerstudio.com/tr/">
    <title>Star Speaker</title>
    <script>
      (() => {
        const query = new URLSearchParams(location.search);
        const requestedLocale = query.get("lang");
        const locale = requestedLocale === "en" ? "en" : "tr";
        query.delete("lang");
        const search = query.size ? `?${query}` : "";
        location.replace(`/${locale}/${search}#programs`);
      })();
    </script>
  </head>
  <body data-legacy-route="program.html">
    <p><a href="/tr/#programs">Star Speaker ana sayfasına devam et</a></p>
  </body>
</html>
